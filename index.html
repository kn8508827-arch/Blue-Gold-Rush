<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071a35">
<title>Blue-Gold-Rush | Team Smaoh Sneha</title>
<style>
:root{--blue:#20c8ff;--gold:#ffc847;--ink:#06142b;--panel:#0a2446}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041126;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;touch-action:pan-y}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#071b42 0%,#0a4e83 48%,#0b223c 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;top:env(safe-area-inset-top,10px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px clamp(10px,3vw,28px);gap:8px;pointer-events:none}
.brand{font-weight:950;letter-spacing:.04em;text-shadow:0 2px 10px #00152d;font-size:clamp(16px,2.6vw,26px)}.brand span{color:var(--gold)}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{background:#06152dd9;border:1px solid #7bdfff66;border-radius:13px;padding:7px 11px;min-width:76px;text-align:center;box-shadow:0 5px 20px #00101f55}.stat b{display:block;font-size:clamp(16px,2.4vw,23px)}.stat small{color:#b9d9ef;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.coinrow{display:flex;align-items:center;justify-content:center;gap:5px}.coinrow img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid white}
.overlay{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#03112670;backdrop-filter:blur(4px)}
.card{width:min(92vw,460px);padding:clamp(20px,5vw,34px);border:1px solid #7be1ff66;border-radius:25px;text-align:center;background:linear-gradient(155deg,#102d53f5,#06142cf5);box-shadow:0 20px 70px #0008}
.logos{display:flex;justify-content:center;gap:14px;margin-bottom:14px}.logos img{width:clamp(66px,18vw,94px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #ffffffd9;box-shadow:0 0 22px #25c8ff55}
h1{font-size:clamp(28px,7vw,42px);line-height:1;margin:8px 0 10px;font-weight:1000;letter-spacing:-.04em}h1 em{font-style:normal;color:var(--gold)}.subtitle{color:#c6e2f7;line-height:1.5;margin:0 auto 18px;max-width:330px}
button{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:900;cursor:pointer;color:#03152c;background:linear-gradient(100deg,#35d4ff,#8ceaff);box-shadow:0 7px 22px #20bfff33}button.gold{background:linear-gradient(100deg,#ffcf57,#fff0a2)}button:active{transform:scale(.98)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.hint{font-size:12px;color:#9fc5e2;margin-top:17px;line-height:1.6}
#pauseBtn{pointer-events:auto;position:absolute;z-index:2;bottom:18px;right:18px;background:#071a35d9;color:white;border:1px solid #9edfff88;padding:10px 14px;font-size:13px}
#toast{position:absolute;z-index:4;top:25%;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:#06152de8;color:white;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media(max-width:520px){.hud{padding:10px}.stat{min-width:62px;padding:6px 8px}.stat small{font-size:9px}.brand{max-width:100px;line-height:1.05}.coinrow img{width:19px;height:19px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c" aria-label="Blue-Gold-Rush endless runner game"></canvas>
<div class="hud"><div class="brand">BLUE <span>GOLD</span><br>RUSH ⚡</div><div class="stats">
<div class="stat"><b id="score">0</b><small>Score</small></div>
<div class="stat"><div class="coinrow"><img src="assets/blue-team-coin.png" alt=""><b id="blueCount">0</b></div><small>Blue coins</small></div>
<div class="stat"><div class="coinrow"><img src="assets/gold-collaboration-coin.png" alt=""><b id="goldCount">0</b></div><small>Gold coins</small></div>
</div></div>
<div id="toast"></div>
<button id="pauseBtn" hidden>Ⅱ Pause</button>
<div class="overlay" id="menu"><div class="card">
<div class="logos"><img src="assets/blue-team-coin.png" alt="Blue Team coin"><img src="assets/gold-collaboration-coin.png" alt="Gold Collaboration coin"></div>
<h1>BLUE <em>GOLD</em> RUSH</h1><p class="subtitle">Run fast. Dodge obstacles. Collect the blue Team coins and golden Collaboration coins!</p>
<button id="startBtn">▶ START RUN</button>
<div class="hint">Desktop: ← → or A / D to change lanes · ↑ / Space to jump · ↓ to slide<br>Mobile: swipe left / right / up / down</div>
</div></div>
</div>
<script>
(()=> {
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,last=0,raf=0,state='menu',score=0,blue=0,gold=0,speed=330,spawn=0,items=[],particles=[],lane=1,playerY=0,jumpV=0,slide=0,invuln=0,roadOffset=0,toastTimer=0;
const blueImg=new Image(),goldImg=new Image();blueImg.src='assets/blue-team-coin.png';goldImg.src='assets/gold-collaboration-coin.png';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,900)}
function reset(){score=blue=gold=0;speed=330;spawn=.3;items=[];particles=[];lane=1;playerY=jumpV=slide=invuln=roadOffset=0;updateHud()}
function updateHud(){$('score').textContent=Math.floor(score);$('blueCount').textContent=blue;$('goldCount').textContent=gold}
function start(){reset();state='run';$('menu').hidden=true;$('pauseBtn').hidden=false;$('pauseBtn').textContent='Ⅱ Pause';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){state='over';$('pauseBtn').hidden=true;$('menu').hidden=false;$('menu').querySelector('h1').innerHTML='RUN <em>OVER</em>';const p=$('menu').querySelector('.subtitle');p.innerHTML=`Score: <b>${Math.floor(score)}</b><br>🔵 Blue coins: <b>${blue}</b> &nbsp; ⚡ Gold coins: <b>${gold}</b><br>Try again and beat your best!`;$('startBtn').textContent='↻ RUN AGAIN'}
function pause(){if(state==='run'){state='pause';$('pauseBtn').textContent='▶ Resume';toast('PAUSED')}else if(state==='pause'){state='run';$('pauseBtn').textContent='Ⅱ Pause';last=performance.now();raf=requestAnimationFrame(loop)}}
$('startBtn').addEventListener('click',()=>{ $('menu').querySelector('h1').innerHTML='BLUE <em>GOLD</em> RUSH';start()});
$('pauseBtn').addEventListener('click',pause);
function laneX(l,depth=1){const horizon=H*.28,base=H*.9;const y=horizon+(base-horizon)*depth;const roadW=W*(.22+.7*depth);return W/2+(l-1)*roadW*.29}
function road(){const horizon=H*.27,base=H*1.04;let g=ctx.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#123a61');g.addColorStop(1,'#071426');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(W/2-W*.12,horizon);ctx.lineTo(W/2+W*.12,horizon);ctx.lineTo(W*1.03,base);ctx.lineTo(-W*.03,base);ctx.closePath();ctx.fill();
ctx.strokeStyle='#32cfff55';ctx.lineWidth=2;for(let i=0;i<2;i++){ctx.beginPath();ctx.moveTo(W/2+(i?1:-1)*W*.04,horizon);ctx.lineTo(W/2+(i?1:-1)*W*.49,base);ctx.stroke()}
for(let i=0;i<18;i++){let d=((i/18+roadOffset%1)%1);let y=horizon+(base-horizon)*d*d;let xW=W*(.12+.48*d*d);ctx.fillStyle=`rgba(73,203,255,${.04+d*.13})`;ctx.fillRect(W/2-xW,y,2*xW,Math.max(1,d*4))}
for(let i=0;i<2;i++){for(let j=0;j<9;j++){let d=((j/9+roadOffset*.65)%1);let y=horizon+(base-horizon)*d*d;let x=W/2+(i?1:-1)*W*(.07+.47*d*d);ctx.fillStyle='#1c6b89';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(i?1:-1)*W*.025*d,y-W*.035*d);ctx.lineTo(x+(i?1:-1)*W*.05*d,y);ctx.fill()}}}
function spawnItem(){let l=Math.floor(Math.random()*3),r=Math.random();let type=r<.59?'coin':r<.8?'block':r<.9?'barrier':'gold';if(type==='coin'&&Math.random()<.35)type='blue';if(type==='coin')type='blue';items.push({l,d:0,type,got:false,phase:Math.random()*6});if(Math.random()<.45){let l2=(l+1+Math.floor(Math.random()*2))%3;items.push({l:l2,d:-.2,type:Math.random()<.65?'blue':'gold',got:false,phase:Math.random()*6})}}
function drawCoin(x,y,r,img,phase){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(phase)*.13);ctx.shadowColor=img===goldImg?'#ffc52c':'#28d7ff';ctx.shadowBlur=18;ctx.fillStyle=img===goldImg?'#ffc52c':'#23caff';ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();if(img.complete&&img.naturalWidth)ctx.drawImage(img,-r,-r,r*2,r*2);else{ctx.fillStyle=img===goldImg?'#ffc52c':'#23caff';ctx.fillRect(-r,-r,2*r,2*r)}ctx.restore()}
function drawItems(dt){for(let it of items){it.d+=dt*speed/Math.max(220,H*.9);it.phase+=dt*4;let d=Math.max(0,it.d),y=H*.28+(H*.68)*d*d,x=laneX(it.l,d),scale=.18+.9*d,r=Math.max(6,17*scale);
if(it.type==='blue'||it.type==='gold'){drawCoin(x,y,r,it.type==='gold'?goldImg:blueImg,it.phase);if(d>.83&&!it.got&&it.l===lane){if(playerY>20||slide>0){ }else{it.got=true;if(it.type==='gold')gold++;else blue++;score+=it.type==='gold'?35:15;for(let n=0;n<8;n++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:-Math.random()*160,life:.55,color:it.type==='gold'?'#ffcf4d':'#35d9ff'});toast(it.type==='gold'?'+1 GOLD COIN ⚡':'+1 BLUE COIN 🔵')}}}
else if(d>.82&&d<.96&&!it.got&&it.l===lane&&playerY<18&&slide<=0){it.got=true;end()}
else{ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(it.type==='block'){ctx.fillStyle='#f15b55';ctx.fillRect(-22,-34,44,40);ctx.fillStyle='#ffb5a8';ctx.fillRect(-16,-28,32,7);ctx.fillStyle='#8b252f';ctx.fillRect(-22,1,44,6)}else{ctx.fillStyle='#f4bd45';ctx.fillRect(-30,-10,60,10);ctx.fillStyle='#fff0ad';ctx.fillRect(-27,-10,54,3);ctx.fillStyle='#be7e26';ctx.fillRect(-28,0,7,13);ctx.fillRect(21,0,7,13)}ctx.restore()}}
items=items.filter(it=>it.d<1.16&&!it.got)}
function drawPlayer(dt){if(jumpV!==0||playerY>0){playerY+=jumpV*dt;jumpV-=1250*dt;if(playerY<0){playerY=0;jumpV=0}}if(slide>0)slide=Math.max(0,slide-dt);let x=laneX(lane,.92),y=H*.82-playerY,scale=Math.min(1.2,H/700);ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='#2ed6ff';ctx.shadowBlur=invuln>0?24:8;
ctx.fillStyle='#001a31';ctx.beginPath();ctx.ellipse(0,34,22,7,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
if(slide>0){ctx.fillStyle='#12b9f5';roundRect(-22,3,44,20,8);ctx.fillStyle='#e4f8ff';ctx.beginPath();ctx.arc(17,1,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#102b4c';ctx.fillRect(-19,18,16,8);ctx.fillRect(6,18,16,8)}
else{ctx.fillStyle='#13bdf5';roundRect(-15,-4,30,36,9);ctx.fill();ctx.fillStyle='#d9f6ff';ctx.beginPath();ctx.arc(0,-18,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15395b';ctx.fillRect(-10,-21,20,5);ctx.fillStyle='#ffca51';ctx.fillRect(-13,4,26,5);ctx.fillStyle='#102b4c';ctx.fillRect(-13,27,9,13);ctx.fillRect(4,27,9,13);ctx.fillStyle='#28d7ff';ctx.fillRect(-18,0,7,20);ctx.fillRect(11,0,7,20)}
ctx.restore();if(invuln>0)invuln-=dt}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawParticles(dt){for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}
function loop(now){if(state!=='run')return;let dt=Math.min((now-last)/1000,.04);last=now;score+=dt*10;speed=Math.min(650,speed+dt*3);roadOffset+=dt*speed/300;spawn-=dt;if(spawn<=0){spawn=Math.max(.36,1.05-score/1800)*(0.75+Math.random()*.5);spawnItem()}ctx.clearRect(0,0,W,H);road();drawItems(dt);drawPlayer(dt);drawParticles(dt);updateHud();raf=requestAnimationFrame(loop)}
function move(dir){if(state!=='run')return;if(dir==='left')lane=Math.max(0,lane-1);if(dir==='right')lane=Math.min(2,lane+1);if(dir==='up'&&playerY===0){jumpV=600;toast('JUMP!')}if(dir==='down'&&slide===0){slide=.65;toast('SLIDE!')}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')move('left');if(k==='arrowright'||k==='d')move('right');if(k==='arrowup'||k==='w'||k===' ')move('up');if(k==='arrowdown'||k==='s')move('down');if(k==='escape'||k==='p')pause()},{passive:false});
let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy<0?'up':'down')},{passive:true});
function idle(){if(state==='run')return;ctx.clearRect(0,0,W,H);roadOffset+=.001;road();requestAnimationFrame(idle)}idle();
})();
</script>
</body>
</html>
