<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140608">
<title>រឿងភាគចិន</title>
<link rel="icon" href="../cooler-fly/cooler.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#120507;--card:#1f0b0f;--ink:#fff6ee;--mist:#d9b9a8;--gold:#ffcf6b;--red:#e2353b;
  --kh:"Kantumruy Pro",system-ui,sans-serif;--zh:"Noto Serif SC",serif;--dsp:"Unbounded","Kantumruy Pro",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--kh);line-height:1.55;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);
  background:radial-gradient(560px 360px at 100% -10%,rgba(226,53,59,.35),transparent 60%),
             radial-gradient(500px 360px at -20% 30%,rgba(255,207,107,.12),transparent 60%),var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:14px;background:#2a1015;display:grid;place-items:center;text-decoration:none;font-size:18px}
h1{margin:0;font-size:21px}
.sub{color:var(--mist);font-size:13.5px;margin:0 0 14px}
.q{display:flex;align-items:center;gap:8px;background:#2a1015;border-radius:16px;padding:10px 14px;margin-bottom:14px}
.q input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none}
.card{border-radius:22px;overflow:hidden;background:var(--card);margin-bottom:14px;box-shadow:0 14px 30px -18px #000,inset 0 0 0 1px #ffcf6b22}
.poster{position:relative;padding:20px 18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.poster .zh{position:absolute;right:14px;top:6px;font-family:var(--zh);font-size:54px;line-height:1.1;color:#ffffff22;letter-spacing:4px}
.poster b{font-family:var(--dsp);font-size:19px;letter-spacing:.3px}
.poster .zh2{font-family:var(--zh);color:var(--gold);font-size:17px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{font-size:12px;padding:3px 9px;border-radius:99px;background:#00000040;box-shadow:inset 0 0 0 1px #ffffff26}
.body{padding:12px 16px 14px}
.story{font-size:14px;color:#f3e2d6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.open .story{-webkit-line-clamp:unset}
.more{font-size:13px;color:var(--gold);margin-top:4px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links button{padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;color:#2a0b0b;
  background:linear-gradient(135deg,#ffe29a,#ffb347);box-shadow:0 6px 14px -6px #ffb347aa}
.note{font-size:12.5px;color:var(--mist);text-align:center;margin-top:18px}
.err{padding:20px;text-align:center;color:var(--mist)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" id="back" href="./" aria-label="ត្រឡប់ទៅ Hub">←</a><h1>🎬 រឿងភាគចិន</h1></header>
  <p class="sub">រឿងល្អៗ ជ្រើសដោយ Cooler · អានសាច់រឿងជាខ្មែរ ហើយចុចមើលពេញនៅកន្លែងផ្លូវការ</p>
  <label class="q">🔍<input id="q" type="search" placeholder="រករឿង… ឧ. វាំង, ស្នេហា, Untamed" autocomplete="off" aria-label="រករឿង"></label>
  <div id="list"></div>
  <p class="note">🔒 Link ទាំងអស់ទៅកាន់ App / Channel ផ្លូវការប៉ុណ្ណោះ (iQIYI · WeTV · Youku · Viki) — មើលឥតគិតថ្លៃ ឬតាមសមាជិកភាពរបស់ពួកគេ</p>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}
const $ = id => document.getElementById(id);
const KD = "០១២៣៤៥៦៧៨៩", KH = n => String(n).replace(/\d/g, c => KD[c]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const open = url => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {}
  if (tg && tg.openLink) tg.openLink(url, { try_instant_view: false }); else window.open(url, "_blank"); };
let ALL = [];
function render(q) {
  q = (q || "").trim().toLowerCase();
  const items = ALL.filter(d => !q || [d.en, d.zh, d.genre, d.story].join(" ").toLowerCase().includes(q));
  $("list").innerHTML = items.map(d => `
    <article class="card" data-id="${esc(d.id)}">
      <div class="poster" style="background:linear-gradient(150deg,${esc(d.color[0])},${esc(d.color[1])})">
        <div class="zh" aria-hidden="true">${esc(d.zh)}</div>
        <b>${esc(d.en)}</b><div class="zh2">${esc(d.zh)}</div>
        <div class="meta"><span>📅 ${KH(d.year)}</span><span>🎞️ ${KH(d.eps)} ភាគ</span><span>${esc(d.genre)}</span></div>
      </div>
      <div class="body">
        <div class="story">${esc(d.story)}</div>
        <button class="more" type="button">អានសាច់រឿងទាំងអស់ ▾</button>
        <div class="links">${d.links.map((l, i) => `<button type="button" data-l="${i}">${esc(l.label)}</button>`).join("")}</div>
      </div>
    </article>`).join("") || `<div class="err">រកមិនឃើញ — សាកពាក្យផ្សេង</div>`;
  document.querySelectorAll(".card").forEach(c => {
    const d = ALL.find(x => x.id === c.dataset.id);
    c.querySelector(".more").addEventListener("click", e => { c.classList.toggle("open");
      e.target.textContent = c.classList.contains("open") ? "បង្រួម ▴" : "អានសាច់រឿងទាំងអស់ ▾"; });
    c.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => open(d.links[+b.dataset.l].url)));
  });
}
$("q").addEventListener("input", e => render(e.target.value));
$("back").addEventListener("click", e => { if (history.length > 1 && document.referrer) { e.preventDefault(); history.back(); } });
fetch("dramas.json").then(r => r.json()).then(j => { ALL = j.dramas || []; render(""); })
  .catch(() => { $("list").innerHTML = `<div class="err">មិនអាចផ្ទុកបញ្ជីរឿងបាន — សាកម្ដងទៀត</div>`; });
</script>
<script src="cooler-mascot.js?v=20261027c" defer></script>
</body>
</html>
