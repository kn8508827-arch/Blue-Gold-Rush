<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>Cooler Daily Tools</title>
<link rel="icon" href="../cooler-fly/cooler.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c12;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--ink:#f4f3ff;--mist:#a7a6c6;
  --cyan:#7cf3ff;--violet:#b48cff;--gold:#ffd166;--pink:#ff8ad8;--ok:#4cd17a;--bad:#ff9aaa;--acc:#ff7a8a;--acc2:#ffb36b;
  --kh:"Kantumruy Pro",system-ui,sans-serif;--dsp:"Unbounded","Kantumruy Pro",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--kh);line-height:1.5;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:radial-gradient(520px 360px at 90% -10%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 60%),
             radial-gradient(520px 380px at -15% 40%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent 60%),var(--bg)}
.wrap{max-width:620px;margin:0 auto}
button,a,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:12px}
.top{display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;flex:none;border-radius:14px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;text-decoration:none;font-size:18px}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--dsp);font-weight:700;font-size:18px;letter-spacing:.3px}
.top small{display:block;font-family:var(--kh);font-weight:400;font-size:12.5px;color:var(--mist);letter-spacing:0}
.quota{flex:none;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#ffffff12;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:9px 4px;border-radius:20px;font-size:12px;font-weight:600;background:#ffffff0b;box-shadow:inset 0 0 0 1px var(--line);line-height:1.25;text-align:center}
.tab i{font-style:normal;font-size:24px}
.tab.on{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 40%,transparent),color-mix(in srgb,var(--acc2) 26%,transparent));box-shadow:inset 0 0 0 1.5px var(--acc),0 10px 22px -12px var(--acc)}
.banner{display:none;margin-top:14px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,138,216,.14));box-shadow:inset 0 0 0 1px rgba(255,209,102,.35)}
.banner.show{display:block}
.banner b{display:block;font-size:15px}
.banner p{margin:4px 0 10px;font-size:13.5px;color:#e9e6ff}
.banner a{display:inline-block;padding:9px 14px;border-radius:14px;font-weight:700;color:#14122e;text-decoration:none;background:linear-gradient(135deg,var(--gold),var(--pink))}
.card{position:relative;margin-top:14px;padding:16px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px var(--line),0 20px 40px -24px #000}
.hero{display:flex;gap:12px;align-items:center}
.hero .ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 55%,#fff0),color-mix(in srgb,var(--acc2) 40%,#fff0));box-shadow:0 10px 24px -12px var(--acc)}
.hero h2{margin:0;font-size:17px}
.hero p{margin:2px 0 0;font-size:13px;color:var(--mist)}
.step{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:14px;font-weight:700}
.step .n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 11px var(--dsp);background:#ffffff1c}
.step small{margin-left:auto;font-weight:400;font-size:12px;color:var(--mist)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;border-radius:16px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{padding:10px 4px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mist)}
.seg button.on{color:#14122e;background:linear-gradient(135deg,var(--acc2),var(--acc))}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;background:#ffffff12;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#14122e}
.chip.ex{background:rgba(124,243,255,.07);box-shadow:inset 0 0 0 1px rgba(124,243,255,.22);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{padding:10px 6px;border-radius:16px;font-size:13px;font-weight:600;background:#ffffff0b;box-shadow:inset 0 0 0 1px var(--line);text-align:center;line-height:1.35}
.opt.on{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 34%,transparent),color-mix(in srgb,var(--acc2) 22%,transparent));box-shadow:inset 0 0 0 1.5px var(--acc2)}
textarea,input[type=text],input[type=number]{width:100%;padding:12px 14px;border-radius:16px;border:0;font-size:15px;line-height:1.65;background:rgba(0,0,0,.32);box-shadow:inset 0 0 0 1px var(--line);color-scheme:dark}
textarea{min-height:100px;resize:vertical}
textarea:focus,input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--acc2)}
::placeholder{color:#7c7b98}
.amount{font:700 28px/1.2 var(--dsp);text-align:center;padding:14px}
.drop{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(0,0,0,.25);border:1.5px dashed rgba(255,255,255,.18);cursor:pointer}
.drop img{width:64px;height:64px;flex:none;border-radius:14px;object-fit:cover}
.drop .ph{width:64px;height:64px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:#ffffff10}
.drop b{display:block}
.drop small{color:var(--mist)}
.drop .x{margin-left:auto;padding:6px 10px;border-radius:10px;background:#ffffff14;font-size:12px}
.note{margin-top:8px;font-size:12.5px;color:var(--mist)}
.go{width:100%;margin-top:16px;padding:16px;border-radius:20px;font-weight:700;font-size:16px;color:#14122e;background:linear-gradient(135deg,var(--acc2),var(--acc) 70%,var(--pink));box-shadow:0 14px 30px -14px var(--acc)}
.go.busy{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.go.busy,.rec.on{animation:none}}
.status{min-height:20px;margin-top:8px;font-size:13px;color:var(--mist);text-align:center}
.status.err{color:var(--bad)}
.result{display:none}
.result.show{display:block}
.result h3{margin:0 0 10px;font-size:15.5px}
.txt{white-space:pre-wrap;font-size:14.5px;line-height:1.8;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);word-break:break-word}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button{padding:12px 8px;border-radius:16px;font-weight:700;font-size:14px;background:#ffffff14;box-shadow:inset 0 0 0 1px var(--line)}
.acts .main{grid-column:1/-1;color:#14122e;background:linear-gradient(135deg,var(--gold),var(--pink))}
.list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#ffffff0a;box-shadow:inset 0 0 0 1px var(--line)}
.row .ic{font-size:20px;flex:none}
.row .b{flex:1;min-width:0}
.row .b b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b small{color:var(--mist);font-size:12px}
.row .v{font-weight:700;white-space:nowrap}
.row .v.in{color:var(--ok)}.row .v.out{color:var(--bad)}
.row .del{flex:none;width:34px;height:34px;border-radius:10px;background:#ffffff10;font-size:14px}
.empty{padding:14px;text-align:center;color:var(--mist);font-size:13px}
.rec{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:6px auto 4px;font-size:34px;color:#fff;background:radial-gradient(circle at 35% 30%,#ff8aa0,#ff3b5c 60%,#b0102c);box-shadow:0 0 0 6px rgba(255,59,92,.18),0 14px 34px -10px #ff3b5c}
.rec.on{animation:ring 1.2s ease-in-out infinite}
.rec.on span{display:block;width:30px;height:30px;border-radius:8px;background:#fff}
@keyframes ring{50%{box-shadow:0 0 0 16px rgba(255,59,92,.08),0 14px 34px -10px #ff3b5c}}
.timer{text-align:center;font:700 24px var(--dsp)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{padding:12px 8px;border-radius:18px;text-align:center;background:#ffffff0b;box-shadow:inset 0 0 0 1px var(--line)}
.kpi small{display:block;color:var(--mist);font-size:12px}
.kpi b{display:block;font:700 16px var(--dsp);margin-top:2px}
.kpi.in b{color:var(--ok)}.kpi.out b{color:var(--bad)}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month button{width:42px;height:42px;border-radius:14px;background:#ffffff12;font-size:18px}
.month b{font:700 16px var(--dsp)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .t{height:10px;border-radius:99px;background:#ffffff10;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.days{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px;padding:6px;border-radius:14px;background:rgba(0,0,0,.2)}
.days i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.cmp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.cmp span{padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:#ffffff0d;box-shadow:inset 0 0 0 1px var(--line)}
.cmp .up{color:var(--bad)}.cmp .down{color:var(--ok)}
.bud{margin-top:10px;padding:12px 14px;border-radius:18px;background:#ffffff0a;box-shadow:inset 0 0 0 1px var(--line)}
.bud .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.bud .t{height:14px;margin-top:8px;border-radius:99px;background:#ffffff10;overflow:hidden;position:relative}
.bud .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--gold))}
.bud .t i.warn{background:linear-gradient(90deg,var(--gold),var(--acc2))}.bud .t i.over{background:linear-gradient(90deg,var(--acc),var(--bad))}
.bud .t u{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.55}
.bud small{display:block;margin-top:6px;color:var(--mist);font-size:12px}
.bud .ed{display:flex;gap:6px;margin-top:8px}.bud .ed[hidden]{display:none}.bud .ed input{padding:9px 12px;font-size:15px}
.mini{flex:none;padding:7px 11px;border-radius:12px;font-size:12.5px;font-weight:700;background:#ffffff14;box-shadow:inset 0 0 0 1px var(--line)}
.mini.on{color:#14122e;background:linear-gradient(135deg,var(--acc2),var(--acc))}
.bar.inc .t i{background:linear-gradient(90deg,#4cd17a,#7cf3ff)}
.year{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:8px;padding:8px 6px 0;border-radius:14px;background:rgba(0,0,0,.2)}
.year .m{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.year .p{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.year .p i{width:45%;min-height:2px;border-radius:3px 3px 0 0}.year .p i.a{background:var(--ok)}.year .p i.b{background:var(--bad)}
.year .m small{font-size:10.5px;color:var(--mist);padding:3px 0}
.year .m.now small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:12px;color:var(--mist)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foot{margin-top:16px;text-align:center;font-size:11.5px;color:#7c7b98}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="./" aria-label="ត្រឡប់ទៅ Hub">←</a>
    <h1>🧰 ជំនួយប្រចាំថ្ងៃ <small>ប្រើរាល់ថ្ងៃ · ចុចប្រើភ្លាម</small></h1>
    <span class="quota" id="quota" hidden></span>

  <nav class="tabs" id="tabs" role="tablist" aria-label="មុខងារ"></nav>

  <div class="foot">Cooler Daily Tools · ទិន្នន័យដូចគ្នានឹង Chat Bot · @TeamSmosSneabot</div>

<script>
"use strict";
const API = "https://bot-smos-smea-production.up.railway.app";
const BOT = "TeamSmosSneabot";
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || (() => { const m = location.hash.match(/[#&]tg=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; })();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem("cdt:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("cdt:" + k, JSON.stringify(v)); } catch (e) {} } };
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const notify = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0b0c12"); tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = "./"; }); } catch (e) {} }

const TOOLS = {
  scam: { i: "🚨", t: "ឆែក Scam", a: ["#ff5a6e", "#ff9f5a"], d: "Link · សារ · Screenshot → AI ប្រាប់ថាគួរប្រយ័ត្នឬអត់", ai: 1 },
  money: { i: "💵", t: "ពិនិត្យលុយ", a: ["#4cd17a", "#ffd166"], d: "ថតរូបក្រដាសប្រាក់ → ចំណុចសង្ស័យ + របៀបពិនិត្យដោយដៃ", ai: 1 },
  totext: { i: "📝", t: "Voice→អក្សរ", a: ["#7cc4ff", "#b48cff"], d: "ថតសំឡេង ឬជ្រើស File → AI សរសេរជាអក្សរ Copy បាន", ai: 1 },
  translate: { i: "🌐", t: "បកប្រែ", a: ["#4cd1c0", "#7cc4ff"], d: "អក្សរ ឬរូប (ម៉ឺនុយ ផ្លាក ឯកសារ) → ៨ ភាសា", ai: 1 },
  homework: { i: "📚", t: "លំហាត់", a: ["#ffb36b", "#ff8ad8"], d: "ថតរូបលំហាត់ → ពន្យល់មួយជំហានៗជាខ្មែរ", ai: 1 },
  remind: { i: "⏰", t: "រំលឹក", a: ["#b48cff", "#ff8ad8"], d: "សរសេរធម្មតា → Bot ផ្ញើសាររំលឹកដល់ពេល" },
  cash: { i: "💸", t: "កត់លុយ", a: ["#ffd166", "#4cd17a"], d: "កត់ចាយ/ចូលក្នុង ៣ វិនាទី" },
  report: { i: "📊", t: "របាយការណ៍", a: ["#7cf3ff", "#b48cff"], d: "ថវិកា · ធៀបខែមុន · សរុបឆ្នាំ · AI ណែនាំសន្សំ · Excel" },
  kb: { i: "🗂️", t: "AI ឯកសារ", a: ["#8fa2ff", "#7cf3ff"], d: "បញ្ចូលឯកសារ (តម្លៃ ម៉ោង ច្បាប់) → សួរ AI ឆ្លើយតាមឯកសារ" },
};
const INC = ["💼 ប្រាក់ខែ", "🛒 លក់ដូរ", "🎁 កាដូ / ផ្សេងៗ", "💰 ចំណូល"];
const SCAM_DEMO = "អបអរសាទរ! លោកអ្នកឈ្នះរង្វាន់ $500 ពី ABA 🎉 ចុច https://aba-bonus.xyz ហើយបញ្ចូលលេខកាត និង OTP ដើម្បីទទួលលុយក្នុង ២៤ ម៉ោង";
const REMIND_EX = ["ស្អែកម៉ោង ២ រសៀល ណាត់ជួបភ្ញៀវ", "៣០ នាទីទៀត លេបថ្នាំ", "ថ្ងៃទី ៥ រៀងរាល់ខែ បង់ថ្លៃភ្លើង", "រាល់ថ្ងៃ ម៉ោង ៦ ព្រឹក ហាត់ប្រាណ"];
const HW_EX = ["2x + 5 = 15", "រកក្រឡាផ្ទៃរង្វង់កាំ 7 cm", "Present simple vs present continuous"];
const S = { tool: null, member: null, left: null, limit: 40, cats: [], langs: [], photo: null, audio: null, res: null, month: null };
let F = store.get("f", {});
const fv = (k, d) => (F[S.tool] && F[S.tool][k] !== undefined) ? F[S.tool][k] : d;
const setF = (k, v) => { (F[S.tool] = F[S.tool] || {})[k] = v; store.set("f", F); };

async function post(path, data) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ initData: INIT }, data || {})) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.msg || `😔 មានបញ្ហា (${r.status})`);
  if (j.left !== undefined) { S.left = j.left; quota(); }
  return j;

function shrink(file) {

let mr = null, chunks = [], t0 = 0, tick = null, stream = null;
async function toggleRec() {

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { noiseSuppression: true, echoCancellation: true } });
  } catch (e) { status("🎤 មិនអាចប្រើ Microphone — អនុញ្ញាតក្នុង Settings", true); return; }
  chunks = []; mr = new MediaRecorder(stream);

    clearInterval(tick); stream.getTracks().forEach(t => t.stop());
    const btn = $("rec"); if (btn) { btn.classList.remove("on"); btn.innerHTML = "🎙️"; }
    try { S.audio = await toWav(await new Blob(chunks).arrayBuffer()); if ($("timer")) $("timer").textContent = "✅ រួចរាល់"; status("ចុច 📝 បម្លែងជាអក្សរ"); haptic("medium"); }
    catch (e) { status("😔 ថតមិនបាន — សាកម្ដងទៀត", true); }
  };
  mr.start(); t0 = Date.now(); const btn = $("rec"); btn.classList.add("on"); btn.innerHTML = "<span></span>";
  tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); if ($("timer")) $("timer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; if (s >= 180) mr.stop(); }, 250);
  haptic("medium");
}
function stopRec() { try { if (mr && mr.state === "recording") mr.stop(); } catch (e) {} }
async function toWav(buf) {

  const dec = await new Promise((ok, bad) => { const p = ctx.decodeAudioData(buf, ok, bad); if (p && p.then) p.then(ok, bad); });
  const sr = 16000, len = Math.min(Math.ceil(dec.duration * sr), sr * 180);

}

      setF("amount", ""); render(); status(`${kind === "in" ? "➕" : "➖"} ${money(j.item.amount, j.item.currency)} · ${j.item.category} ✅`); notify("success");
    } else if (k === "kb") {
      btn.textContent = "⏳ AI កំពុងអាន…";
      const j = await post("/tools/kb/ask", { q: fv("q", "") });
      show(j.found ? "🤖 ចម្លើយពីឯកសារ" : "🤷 រកមិនឃើញ", j.text);
    }
  } catch (err) { status(String(err.message || err), true); notify("error"); }
  finally { btn.disabled = false; btn.classList.remove("busy"); btn.textContent = label; }
}
function show(title, text) {
  S.res = { title, text };
  $("out").innerHTML = `<h3>${esc(title)}</h3><div class="txt">${esc(text)}</div><div class="acts"><button type="button" class="main" data-a="copy">📋 Copy</button><button type="button" data-a="send">📤 ផ្ញើចូល Telegram</button><button type="button" data-a="again">🔁 ម្ដងទៀត</button></div>`;
  $("out").classList.add("show"); setTimeout(() => $("out").scrollIntoView({ behavior: "smooth", block: "start" }), 50);
}
$("out").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b || !S.res) return;
  if (b.dataset.a === "copy") {
    try { await navigator.clipboard.writeText(S.res.text); } catch (x) { const a = document.createElement("textarea"); a.value = S.res.text; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (y) {} a.remove(); }
    b.textContent = "✅ Copied"; setTimeout(() => { b.textContent = "📋 Copy"; }, 1500); haptic();
  } else if (b.dataset.a === "send") {
    b.disabled = true; try { await post("/tools/send", S.res); b.textContent = "✅ ផ្ញើរួច"; notify("success"); } catch (err) { b.textContent = "😔 ផ្ញើមិនបាន"; } setTimeout(() => { b.textContent = "📤 ផ្ញើចូល Telegram"; b.disabled = false; }, 2500);
  } else { $("form").scrollIntoView({ behavior: "smooth" }); }
});

// lists

async function loadCash() { if (!INIT || S.member === false) return renderCash([]); try { renderCash((await post("/tools/cash/list")).items); } catch (e) { renderCash([]); } }

  const l = $("list"); if (!l) return;

function renderDocs(items) {
  const l = $("list"); if (!l) return;

async function del(id) {

async function kbAdd() {
  if (!gate()) return;

  try {
    if (S.kfile) { status("⏳ AI កំពុងអានឯកសារ…"); body.file = await readAsData(S.kfile); body.name = S.kfile.name; body.mime = S.kfile.type; }

// report
const USD = v => (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en", { maximumFractionDigits: 2 });
const MON = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
function monthStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function shiftMonth(n) {
  S.month = S.month || monthStr(new Date());
  const [y, m] = S.month.split("-").map(Number);
  const d = fv("rmode", "month") === "year" ? new Date(y + n, m - 1, 1) : new Date(y, m - 1 + n, 1);
  if (d > new Date()) return;
  S.month = monthStr(d); haptic(); loadReport();
}
const pctChip = (p, label, goodDown) => p === null || p === undefined ? "" :
  `<span class="${(p > 0) === goodDown ? "up" : "down"}">${p > 0 ? "▲" : p < 0 ? "▼" : "•"} ${Math.abs(p)}% ${label}</span>`;
async function loadReport() {
  S.month = S.month || monthStr(new Date());
  const [y, m] = S.month.split("-"), year = fv("rmode", "month") === "year";
  $("mlabel").textContent = year ? `ឆ្នាំ ${kh(y)}` : `${MON[+m - 1]} ${kh(y)}`;
  if (!INIT || S.member === false) { $("rep").innerHTML = `<div class="empty">📱 សូមបើកពី Cooler Hub</div>`; return; }
  $("rep").innerHTML = `<div class="empty">⏳</div>`;
  try { year ? yearReport(await post("/tools/report/year", { year: y }), +y) : monthReport(await post("/tools/report", { month: S.month }), y, m); }
  catch (err) { $("rep").innerHTML = ""; status(err.message, true); }
}
function yearReport(r, y) {
  const max = Math.max(...r.months.map(x => Math.max(x[1], x[2])), 0.01), now = new Date();
  let h = `<div class="kpis"><div class="kpi in"><small>➕ ចំណូលឆ្នាំ</small><b>${USD(r.income)}</b></div><div class="kpi out"><small>➖ ចំណាយឆ្នាំ</small><b>${USD(r.spent)}</b></div><div class="kpi"><small>${r.balance >= 0 ? "💚" : "❤️"} សល់</small><b>${USD(r.balance)}</b></div></div>`;
  const active = r.months.filter(x => x[1] || x[2]);
  if (!active.length) { $("rep").innerHTML = h + `<div class="empty">ឆ្នាំនេះមិនទាន់មានកំណត់ត្រា</div>`; return; }
  const best = active.reduce((a, x) => x[1] - x[2] > a[1] - a[2] ? x : a), worst = active.reduce((a, x) => x[2] > a[2] ? x : a);
  h += `<div class="cmp"><span>📈 សន្សំល្អបំផុត៖ ${MON[best[0] - 1]} (${USD(best[1] - best[2])})</span><span class="up">💸 ចាយច្រើនបំផុត៖ ${MON[worst[0] - 1]} (${USD(worst[2])})</span><span>📊 មធ្យម/ខែ៖ ${USD(r.spent / active.length)}</span></div>`;
  h += step("📆", "១២ ខែ", "ចុចខែដើម្បីមើលលម្អិត") + `<div class="year">${r.months.map(([mo, i, o]) => `<button type="button" class="m${y === now.getFullYear() && mo === now.getMonth() + 1 ? " now" : ""}" data-mo="${mo}" title="${MON[mo - 1]}: +${USD(i)} / −${USD(o)}"><span class="p"><i class="a" style="height:${100 * i / max}%"></i><i class="b" style="height:${100 * o / max}%"></i></span><small>${kh(mo)}</small></button>`).join("")}</div>`;
  h += `<div class="legend"><span><i style="background:var(--ok)"></i>ចំណូល</span><span><i style="background:var(--bad)"></i>ចំណាយ</span></div>`;
  $("rep").innerHTML = h;
  $("rep").querySelectorAll("[data-mo]").forEach(b => b.onclick = e => { e.stopPropagation(); S.month = `${y}-${String(b.dataset.mo).padStart(2, "0")}`; setF("rmode", "month"); render(); });
}
function monthReport(r, y, m) {
  S.rep = r;
  let h = `<div class="kpis"><div class="kpi in"><small>➕ ចំណូល</small><b>${USD(r.income)}</b></div><div class="kpi out"><small>➖ ចំណាយ</small><b>${USD(r.spent)}</b></div><div class="kpi"><small>${r.balance >= 0 ? "💚" : "❤️"} សល់</small><b>${USD(r.balance)}</b></div></div>`;
  h += `<div class="note" style="text-align:center">≈ ${Math.round(r.balance * r.khr).toLocaleString()} ៛ · 1$ ≈ ${Math.round(r.khr).toLocaleString()} ៛ · ${r.count} កំណត់ត្រា</div>`;
  h += `<div class="cmp">${pctChip(r.prev.spentPct, "ចំណាយធៀបខែមុន", true)}${pctChip(r.prev.incomePct, "ចំណូលធៀបខែមុន", false)}${r.savingRate !== null ? `<span class="${r.savingRate >= 0 ? "down" : "up"}">🐷 សន្សំបាន ${r.savingRate}%</span>` : ""}<span>📅 មធ្យម ${USD(r.avgDay)}/ថ្ងៃ</span></div>`;
  // budget
  const bp = r.budgetPct, cls = bp === null ? "" : bp >= 100 ? "over" : bp >= 80 ? "warn" : "";
  h += `<div class="bud" id="bud"><div class="l"><b>🎯 ថវិកាចាយប្រចាំខែ</b>${r.budget ? `<span>${USD(r.spent)} / ${USD(r.budget)}</span>` : ""}<button type="button" class="mini" id="budEdit">${r.budget ? "✏️ កែ" : "➕ កំណត់"}</button></div>`;
  if (r.budget) {
    const dayMark = r.current ? 100 * r.elapsed / r.monthDays : 100;
    h += `<div class="t"><i class="${cls}" style="width:${Math.min(100, bp)}%"></i>${r.current ? `<u style="left:${dayMark}%" title="ថ្ងៃនេះ"></u>` : ""}</div>`;
    const left = r.budget - r.spent;
    h += `<small>${bp >= 100 ? `🚨 លើសថវិកា ${USD(-left)} ហើយ!` : bp >= 80 ? `⚠️ ជិតដល់ថវិកា — នៅសល់ ${USD(left)}` : `✅ នៅសល់ ${USD(left)}`}${r.current && left > 0 ? ` · អាចចាយបាន ~${USD(left / Math.max(1, r.monthDays - r.elapsed + 1))}/ថ្ងៃ` : ""}</small>`;
  } else h += `<small>កំណត់ថវិកា ដើម្បីដឹងថាចាយលើសឬអត់ ✨</small>`;
  h += `<div class="ed" id="budForm" hidden><input type="number" inputmode="decimal" id="budVal" min="0" placeholder="ឧ. 300 ($)" value="${r.budget || ""}"><button type="button" class="mini on" id="budSave">💾</button></div></div>`;
  // forecast
  if (r.current && r.spent) h += `<div class="note" style="text-align:center">🔮 បើចាយបែបនេះ ដល់ចុងខែនឹងចាយប្រហែល <b>${USD(r.projected)}</b>${r.budget ? (r.projected > r.budget ? ` — លើសថវិកា ${USD(r.projected - r.budget)} ⚠️` : " — ក្នុងថវិកា ✅") : ""}</div>`;
  if (r.cats.length) h += step("🏷️", "ចំណាយតាមប្រភេទ") + `<div class="bars">${r.cats.map(([c, v, p]) => `<div class="bar"><div class="l"><span>${esc(c)}</span><b>${USD(v)} · ${p}%</b></div><div class="t"><i style="width:${p}%"></i></div></div>`).join("")}</div>`;
  if (r.incomeCats.length) h += step("💰", "ចំណូលមកពី") + `<div class="bars">${r.incomeCats.map(([c, v, p]) => `<div class="bar inc"><div class="l"><span>${esc(c)}</span><b>${USD(v)} · ${p}%</b></div><div class="t"><i style="width:${p}%"></i></div></div>`).join("")}</div>`;
  if (r.top.length) h += step("🔝", "ចាយធំៗ ៥") + `<div class="list">${r.top.map((t, i) => `<div class="row"><span class="ic">${["🥇", "🥈", "🥉", "4️⃣", "5️⃣"][i]}</span><span class="b"><b>${esc(t.note)}</b><small>${esc(t.cat)} · ${when(t.at)}</small></span><span class="v out">−${money(t.amount, t.currency)}</span></div>`).join("")}</div>`;
  const maxDay = Math.max(...r.days.map(d => d[1]), 0.01), dm = Object.fromEntries(r.days);
  if (r.days.length) h += step("📅", "ចំណាយរាល់ថ្ងៃ") + `<div class="days" aria-label="ចំណាយរាល់ថ្ងៃ">${Array.from({ length: r.monthDays }, (_, i) => `<i title="${i + 1}: ${USD(dm[i + 1] || 0)}" style="height:${Math.max(2, 100 * (dm[i + 1] || 0) / maxDay)}%"></i>`).join("")}</div>`;
  h += step("🤖", "AI ណែនាំការសន្សំ", "តាមលេខពិតរបស់អ្នក") + `<div id="tips"><button type="button" class="go" id="tipsGo" style="margin-top:6px">✨ សុំគន្លឹះសន្សំលុយពី AI</button></div>`;
  h += `<div class="acts"><button type="button" class="main" id="repSend">📤 ផ្ញើរូបរបាយការណ៍ + Excel ចូល Telegram</button><button type="button" id="repText">💬 ផ្ញើជាអក្សរ</button><button type="button" id="repCsv">📄 ទាញ CSV</button></div>`;
  if (!r.count) h = `<div class="empty">ខែនេះមិនទាន់មានកំណត់ត្រា — ទៅ 💸 កត់លុយ</div>` + h.slice(h.indexOf('<div class="bud"'), h.indexOf("</div></div>", h.indexOf('id="budForm"')) + 12);
  $("rep").innerHTML = h;
  const stop = f => e => { e.stopPropagation(); f(); };
  $("budEdit").onclick = stop(() => { $("budForm").hidden = !$("budForm").hidden; $("budVal").focus(); });
  $("budSave").onclick = stop(async () => {
    try { await post("/tools/budget/set", { usd: $("budVal").value || "0" }); notify("success"); loadReport(); } catch (e) { status(e.message, true); }
  });
  if (!r.count) return;
  $("tipsGo").onclick = stop(async () => {
    const b = $("tipsGo"); b.disabled = true; b.textContent = "⏳ AI កំពុងគិត…";
    try { const j = await post("/tools/report/tips", { month: S.month }); $("tips").innerHTML = `<div class="txt">${esc(j.text)}</div>`; notify("success"); quota(); }
    catch (e) { b.disabled = false; b.textContent = "✨ សុំគន្លឹះសន្សំលុយពី AI"; status(e.message, true); }
  });
  $("repSend").onclick = stop(async () => {
    const b = $("repSend"); b.disabled = true; b.textContent = "⏳ កំពុងផ្ញើ…";
    try { await post("/tools/report/send", { month: S.month }); b.textContent = "✅ ផ្ញើរួច — មើលក្នុង Chat Bot"; notify("success"); }
    catch (e) { b.disabled = false; b.textContent = "📤 ផ្ញើរូបរបាយការណ៍ + Excel ចូល Telegram"; status(e.message, true); }
  });
  $("repText").onclick = stop(async () => {
    const text = [`ចំណូល៖ ${USD(r.income)}`, `ចំណាយ៖ ${USD(r.spent)}`, `សល់៖ ${USD(r.balance)}`, r.budget ? `ថវិកា៖ ${USD(r.budget)} (${r.budgetPct}%)` : "", "", ...r.cats.map(([c, v, p]) => `${c}៖ ${USD(v)} (${p}%)`)].filter((x, i, a) => x || a[i - 1]).join("\n");
    try { await post("/tools/send", { title: `📊 របាយការណ៍ ${MON[+m - 1]} ${y}`, text }); $("repText").textContent = "✅ ផ្ញើរួច"; } catch (e) { status(e.message, true); }
  });
  $("repCsv").onclick = stop(async () => {
    try {
      const items = (await post("/tools/cash/list", { month: S.month, limit: 1000 })).items || [];
      const rows = [["date", "type", "category", "note", "amount", "currency"], ...items.map(i => [new Date(i.at * 1000).toISOString().slice(0, 16).replace("T", " "), i.kind === "in" ? "income" : "expense", i.category, i.note || "", i.amount, i.currency])];
      const csv = "﻿" + rows.map(row => row.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `cooler-cash-${S.month}.csv`; a.click();
      status("📄 បើបើកក្នុង Telegram មិនបាន — ចុច 📤 ផ្ញើ ដើម្បីទទួល File ក្នុង Chat");
    } catch (e) { status(e.message, true); }
  });
}
