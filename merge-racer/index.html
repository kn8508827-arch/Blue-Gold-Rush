<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a1f">
<title>Cooler Merge Racer · 2050</title>
<link rel="icon" href="../cooler-fly/cooler.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#060a1f;--glass:rgba(16,22,52,.75);--line:rgba(140,210,255,.22);--a:#2bd0ff;--b:#ff4fd8;--gold:#ffd23f;--text:#eef6ff;--muted:#9fb3d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(900px 600px at 50% 0%,#1b2a6b,#060a1f 65%);color:var(--text);font-family:"Kantumruy Pro",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);gap:8px}
.top{display:flex;align-items:center;gap:8px}
.coins{flex:1;padding:6px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.coins b{display:block;font-family:Orbitron,sans-serif;font-size:24px;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.6)}
.coins small{color:var(--muted);font-size:12px}
.icon{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:20px}
.boost{width:auto;padding:0 12px;font-weight:700;font-size:14px;background:linear-gradient(100deg,#ff4fd8,#7c4dff);border:0;box-shadow:0 0 16px rgba(255,79,216,.5)}
.boost:disabled{background:var(--glass);box-shadow:none;opacity:.7}
#track{flex:1.15;min-height:200px;width:100%;border-radius:22px;border:1px solid var(--line);background:#070c24}
.label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.garage{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1.15;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));display:grid;place-items:center;touch-action:none}
.slot img{width:84%;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.slot .lv{position:absolute;left:5px;top:4px;font-family:Orbitron,sans-serif;font-size:12px;font-weight:900;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.45)}
.slot.over{outline:2px solid var(--gold);background:rgba(255,210,63,.12)}
.slot.match{box-shadow:0 0 0 2px rgba(46,230,160,.7) inset}
.bottom{display:grid;grid-template-columns:1fr auto;gap:8px}
.buy{display:flex;align-items:center;gap:10px;padding:8px 14px;border:0;border-radius:18px;background:linear-gradient(100deg,var(--gold),#ff9b2e);color:#2a1300;box-shadow:0 0 22px rgba(255,190,50,.5);text-align:left}
.buy img{width:64px}
.buy b{display:block;font-size:18px}.buy span{font-family:Orbitron,sans-serif;font-weight:900;font-size:17px}
.buy:disabled{filter:grayscale(.6) brightness(.7)}
.sortbtn{border-radius:18px;border:1px solid var(--line);background:var(--glass);padding:0 14px;font-weight:700;font-size:14px}
#ghost{position:fixed;z-index:50;width:90px;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));display:none}
.pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(3,6,20,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pop[hidden]{display:none}
.card{width:min(88vw,360px);text-align:center;padding:22px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,#18307a,#0a1030);box-shadow:0 0 50px rgba(43,208,255,.35);animation:pop .45s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card img{width:200px;filter:drop-shadow(0 0 22px var(--a))}
.card h2{margin:6px 0}.card p{color:#cfe2ff;margin:4px 0 14px}
.ok{border:0;border-radius:14px;padding:12px 26px;font-size:17px;font-weight:700;color:#2a1300;background:linear-gradient(100deg,var(--gold),#ff9b2e)}
.toast{position:fixed;z-index:70;left:50%;top:16%;transform:translateX(-50%);padding:9px 16px;border-radius:14px;background:rgba(8,12,34,.94);border:1px solid var(--line);font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="coins"><b id="coins">0</b><small id="rate">0 / វិនាទី</small></div>
    <button class="icon boost" id="boost" type="button">🚀 x2</button>
    <button class="icon" id="snd" type="button" aria-label="សំឡេង">🔊</button>
  </div>
  <canvas id="track" aria-label="ផ្លូវប្រណាំង"></canvas>
  <div class="label"><span id="onTrack">🏁 លើផ្លូវ 0/8 · អូសឡានឡើងផ្លូវ</span><span id="best">🏆 Lv 1</span></div>
  <div class="garage" id="garage"></div>
  <div class="bottom">
    <button class="buy" id="buy" type="button"><img id="buyImg" alt=""><div><b>ទិញឡាន</b><span id="buyCost">20</span> 🪙</div></button>
    <button class="sortbtn" id="sortBtn" type="button">🔀<br>បញ្ចូលស្វ័យ</button>
  </div>
</div>
<img id="ghost" alt="">
<div class="pop" id="pop" hidden><div class="card"><img id="popImg" alt=""><h2 id="popTitle"></h2><p id="popText"></p><button class="ok" id="popOk" type="button">OK 👍</button></div></div>
<div class="toast" id="toast"></div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
